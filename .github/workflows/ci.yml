name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (offline extras only; no torch or model weights)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[serving,plots,llm,dev]" pyflakes
      - name: Lint
        run: python -m pyflakes src eval tests
      - name: Offline test suite
        run: python -m pytest -q
      - name: Eval set is byte-reproducible from its seed
        run: |
          python -m eval.synthetic_gen generate --offline --output data/eval/eval_set.json
          git diff --exit-code -- data/eval/eval_set.json data/eval/synthetic_corpus.jsonl

  docker:
    name: docker image (offline backends)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t selective-rag:ci .
      - name: Smoke test
        run: |
          docker run -d --name srag -p 8000:8000 -e SRAG_ADMIN_TOKEN=ci-token selective-rag:ci
          for i in $(seq 1 60); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS -X POST localhost:8000/v1/query -H 'Content-Type: application/json' \
            -d '{"query": "For how many epochs is SefiLens trained?", "include_scores": false}' | tee /tmp/answer.json
          grep -q '"abstained":false' /tmp/answer.json
          curl -fsS -X POST localhost:8000/v1/query -H 'Content-Type: application/json' \
            -d '{"query": "Which mortgage refinancing option minimises closing fees?"}' | grep -q '"abstention_stage":"policy"'
      - name: Logs on failure
        if: failure()
        run: docker logs srag || true
